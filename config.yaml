# =============================================================================
# PIPELINE CONFIGURATION
# Edit this file to configure your analysis.
# =============================================================================


# ================== #
#  WHAT TO ANALYZE   #
# ================== #

## -- Folders -- ##
# Where your raw instrument files live
raw_dir: "data/raw-files"
# Where spectral library files live
lib_dir: "data/library-files"
# Where all output files will be written
out_dir: "outputs"


## -- Metadata files (column mapping lives in ADVANCED section) -- ##
# CSV files describing your experiments, one row per experiment type
meta_prot_csv: "data/metaFiles_gProt_BHA_2.csv"
meta_phos_csv: "data/metaFiles_gphos_BHA_2.csv"

# SwissProt FASTA used to generate phosphosite motifs (±7 flanks).
# The entry's accession is looked up by the PSM's Master Protein Accession.
swissprot_fasta: "data/SwissProt_2025_03.fasta"


## -- Bridge / pool channel -- ##
# Enable bridge normalization (set false if no bridge/pool channel exists)
bridge_enabled: true

# Regex matching bridge/pool channel names
# ignored when bridge_enabled = false
pool_regex: "BRG"


## -- Post-bridge toggle (multi-run combined outputs) -- ##
gprot_post_bridge: true
phos_post_bridge: true


# ====================== #
#  FILTERS & THRESHOLDS  #
# ====================== #

## -- PSM quality -- ##
# Only PSMs whose mass error (in ppm) falls within this window are kept
delta_ppm_max: 5

# Maximum allowed expectation value (lower = stricter)
expectation_max: 0.05

# Minimum Ions Score
ions_score_min: 15

# Only keep PSMs whose Modifications field contains this string
require_mod_contains: "TMT"


## -- Channel presence -- ##
# Minimum fraction of TMT channels with quantified values
# 0.33 = at least one-third of channels present
min_fraction_channels_present: 0.33


## -- gProt-specific settings -- ##
# Each filter has TWO keys — the on/off toggle AND the quantile value.
# If you flip a toggle, double-check the quantile too.

# Keep only the top X% most abundant PSMs
gprot_use_top_quantile: false
gprot_top_quantile: 0.75      # Keep top 25%

# Keep only the lowest-variance PSMs
gprot_use_low_variance: false
gprot_low_variance_quantile: 0.25   # Keep lowest 25% CV


## -- Phospho-specific settings -- ##
# Minimum average abundance for phospho PSMs
phos_min_abundance: 1000

# Minimum PhosphoRS site probability (0–100); higher = stricter localization
phos_ptmrs_threshold: 50

# Filter by enrichment type: "pY" or "pSQTQ" (leave blank to disable)
phos_enrichment_filter: ""


# ==================== #
#  OUTPUT NAMING & QC  #
# ==================== #

# Phos output naming.
# Set folder + file_prefix when running multiple phos flavors per experiment
# (e.g. folder="pY", file_prefix="pY"). Blank file_prefix => default 01_, 02_...
phos_output_folder: "phos"
phos_output_file_prefix: ""

# Number of top-variable proteins/sites in the QC heatmap
qc_top_n: 300

# Z-score normalize the QC heatmap
qc_zscore: true


# ======================================== #
#  ADVANCED SETTINGS (normally unchanged)  #
# ======================================== #

# Column in the metadata CSV that identifies each experiment
meta_index: "expType"

# Column names inside the metadata CSVs
meta_cols:
  psms:     "PSMs"
  mgf:      "mgf_file"
  library:  "library"
  pepts:    "pepts"
  mods:     "mods"
  sup_corr: "sup_corr"

# Text that identifies abundance columns in the PSM file
abundance_contains: "Abundance"

# Regex pattern for PTM filtering in the Modifications column
phos_mod_filter: "Phos"

# Flank width for FASTA-derived motifs. 7 → 15-mer (Kinase Library standard):
# 7 residues upstream, the phosphosite (lowercase), 7 residues downstream.
# Out-of-protein positions are padded with "_".
phos_motif_flank: 7
